<!doctype html>
<meta charset="utf-8" />
<title>Fotogramas del hero</title>
<pre id="log" style="font: 12px/1.5 monospace; white-space: pre-wrap"></pre>
<script type="module">
  /*
   * Decodifica el MP4 con WebCodecs y manda cada fotograma, ya en WebP, al
   * servidor (server.mjs), que los guarda como 001.webp, 002.webp…
   *
   * Parámetros de la URL:
   *   w=1280      ancho de salida (por defecto, el del video)
   *   q=0.78      calidad de la compresión
   *   fmt=webp    webp o jpeg
   *   prefix=     prefijo del nombre de archivo (opcional)
   *   analyze=1   además mide dónde está el auto en cada fotograma e imprime
   *               la lista `focus` de src/components/hero-video/sequence.ts.
   *               Sirve para el video horizontal. En el vertical no es fiable
   *               (el auto empieza oscuro y el suelo mojado refleja mucho): su
   *               lista se fijó mirando los fotogramas.
   */
  const logEl = document.getElementById('log')
  const log = (...parts) => {
    const text = parts.join(' ')
    logEl.textContent += text + '\n'
    fetch('/log?' + encodeURIComponent(text))
  }

  const params = new URLSearchParams(location.search)
  const OUT_W = Number(params.get('w') || 0)
  const TYPE = 'image/' + (params.get('fmt') || 'webp')
  const QUALITY = Number(params.get('q') || 0.78)
  const PREFIX = params.get('prefix') || ''
  const ANALYZE = params.get('analyze') === '1'
  const EXT = TYPE === 'image/jpeg' ? 'jpg' : TYPE.split('/')[1]

  /** Cajas del MP4 que hacen falta para sacar las muestras de vídeo. */
  function parseMp4(buf) {
    const dv = new DataView(buf.buffer)
    const str = (p, n) => String.fromCharCode(...buf.subarray(p, p + n))
    const CONTAINERS = new Set(['moov', 'trak', 'mdia', 'minf', 'stbl', 'edts', 'dinf'])
    const tracks = []
    let t = null

    const walk = (start, end) => {
      let p = start
      while (p + 8 <= end) {
        let size = dv.getUint32(p)
        const type = str(p + 4, 4)
        let header = 8
        if (size === 1) {
          size = Number(dv.getBigUint64(p + 8))
          header = 16
        }
        if (size === 0) size = end - p
        const b = p + header
        const count = () => dv.getUint32(b + 4)

        if (type === 'trak') tracks.push((t = {}))
        if (type === 'hdlr') t.handler = str(b + 8, 4)
        if (type === 'mdhd') t.timescale = dv.getUint32(b + (buf[b] ? 20 : 12))
        if (type === 'stsd') {
          const entry = b + 8
          const entrySize = dv.getUint32(entry)
          t.width = dv.getUint16(entry + 32)
          t.height = dv.getUint16(entry + 34)
          for (let q = entry + 86; q + 8 <= entry + entrySize; q += dv.getUint32(q)) {
            if (str(q + 4, 4) === 'avcC') t.avcC = buf.slice(q + 8, q + dv.getUint32(q))
          }
        }
        if (type === 'stts') t.stts = Array.from({ length: count() }, (_, i) => [dv.getUint32(b + 8 + i * 8), dv.getUint32(b + 12 + i * 8)])
        if (type === 'ctts') {
          const signed = buf[b] === 1
          t.ctts = Array.from({ length: count() }, (_, i) => [dv.getUint32(b + 8 + i * 8), signed ? dv.getInt32(b + 12 + i * 8) : dv.getUint32(b + 12 + i * 8)])
        }
        if (type === 'stsc') t.stsc = Array.from({ length: count() }, (_, i) => [dv.getUint32(b + 8 + i * 12), dv.getUint32(b + 12 + i * 12)])
        if (type === 'stsz') {
          const fixed = dv.getUint32(b + 4)
          t.sizes = Array.from({ length: dv.getUint32(b + 8) }, (_, i) => fixed || dv.getUint32(b + 12 + i * 4))
        }
        if (type === 'stco') t.chunks = Array.from({ length: count() }, (_, i) => dv.getUint32(b + 8 + i * 4))
        if (type === 'co64') t.chunks = Array.from({ length: count() }, (_, i) => Number(dv.getBigUint64(b + 8 + i * 8)))
        if (type === 'stss') t.sync = new Set(Array.from({ length: count() }, (_, i) => dv.getUint32(b + 8 + i * 4)))

        if (CONTAINERS.has(type)) walk(b, p + size)
        p += size
      }
    }
    walk(0, buf.length)
    return tracks.find((track) => track.handler === 'vide')
  }

  /** Posición en el archivo, tiempo de decodificación y de presentación de cada muestra. */
  function samplesOf(v) {
    const samples = v.sizes.map((size, i) => ({ size, key: !v.sync || v.sync.has(i + 1) }))
    let s = 0
    v.stsc.forEach(([first, perChunk], e) => {
      const next = e + 1 < v.stsc.length ? v.stsc[e + 1][0] : v.chunks.length + 1
      for (let c = first; c < next; c += 1) {
        let offset = v.chunks[c - 1]
        for (let k = 0; k < perChunk && s < samples.length; k += 1, s += 1) {
          samples[s].offset = offset
          offset += samples[s].size
        }
      }
    })
    let dts = 0
    s = 0
    for (const [n, delta] of v.stts) for (let k = 0; k < n; k += 1, s += 1) {
      samples[s].cts = dts
      dts += delta
    }
    s = 0
    if (v.ctts) for (const [n, offset] of v.ctts) for (let k = 0; k < n; k += 1, s += 1) samples[s].cts += offset
    for (const x of samples) x.us = Math.round((x.cts / v.timescale) * 1e6)
    return samples
  }

  /**
   * Caja del auto en un fotograma: columnas con píxeles claros y neutros (no
   * el neón verde) en la franja de la carrocería.
   */
  function measureCar(frame) {
    const W = 320
    const H = Math.round((W * frame.displayHeight) / frame.displayWidth)
    const small = new OffscreenCanvas(W, H)
    const ctx = small.getContext('2d', { willReadFrequently: true })
    ctx.drawImage(frame, 0, 0, W, H)
    const d = ctx.getImageData(0, 0, W, H).data
    const cols = new Array(W).fill(0)
    const y0 = Math.round(H * 0.26)
    const y1 = Math.round(H * 0.78)
    for (let y = y0; y < y1; y += 1) {
      for (let x = 0; x < W; x += 1) {
        const i = (y * W + x) * 4
        const [r, g, b] = [d[i], d[i + 1], d[i + 2]]
        if (0.2126 * r + 0.7152 * g + 0.0722 * b > 80 && g - r < 28 && Math.abs(r - b) < 45) cols[x] += 1
      }
    }
    let left = -1
    let right = -1
    let sum = 0
    let weight = 0
    cols.forEach((c, x) => {
      if (c > (y1 - y0) * 0.06) {
        if (left < 0) left = x
        right = x
      }
      sum += x * c
      weight += c
    })
    return { left: left / W, right: (right + 1) / W, centroid: weight ? sum / weight / W : 0.5 }
  }

  /** Centro del auto suavizado, en 12 puntos repartidos por el video. */
  function focusKeys(track) {
    const raw = track.map((f) => {
      const width = f.right - f.left
      // Si la caja toca los dos bordes o se come la pared iluminada, el centroide
      return width > 0.2 && width < 0.9 ? (f.left + f.right) / 2 : f.centroid
    })
    const smooth = raw.map((_, i) => {
      let total = 0
      let n = 0
      for (let k = -6; k <= 6; k += 1) {
        if (raw[i + k] !== undefined) {
          total += raw[i + k]
          n += 1
        }
      }
      return total / n
    })
    return Array.from({ length: 12 }, (_, k) => +smooth[Math.round((k * (smooth.length - 1)) / 11)].toFixed(3))
  }

  try {
    const buf = new Uint8Array(await (await fetch('/video.mp4')).arrayBuffer())
    const v = parseMp4(buf)
    const hex = (x) => x.toString(16).padStart(2, '0')
    const codec = `avc1.${hex(v.avcC[1])}${hex(v.avcC[2])}${hex(v.avcC[3])}`
    const samples = samplesOf(v)
    log('video', `${v.width}x${v.height}`, codec, samples.length, 'fotogramas')

    const config = { codec, description: v.avcC, codedWidth: v.width, codedHeight: v.height }
    if (!(await VideoDecoder.isConfigSupported(config)).supported) throw new Error('este navegador no decodifica ' + codec)

    // Los fotogramas salen en orden de presentación: se numeran por su tiempo
    const indexByUs = new Map([...samples].sort((a, b) => a.cts - b.cts).map((x, i) => [x.us, i]))
    const outW = OUT_W || v.width
    const outH = Math.round((outW * v.height) / v.width)
    const track = []
    const queue = []
    let saved = 0
    let busy = false

    const pump = async () => {
      if (busy) return
      busy = true
      while (queue.length) {
        const { index, canvas } = queue[0]
        const blob = await canvas.convertToBlob({ type: TYPE, quality: QUALITY })
        const name = `${PREFIX ? PREFIX + '-' : ''}${String(index + 1).padStart(3, '0')}.${EXT}`
        await fetch('/frame?name=' + name, { method: 'POST', body: blob })
        queue.shift()
        saved += 1
        document.title = `${saved}/${samples.length}`
      }
      busy = false
    }

    const decoder = new VideoDecoder({
      output: (frame) => {
        const index = indexByUs.get(frame.timestamp)
        const canvas = new OffscreenCanvas(outW, outH)
        const ctx = canvas.getContext('2d')
        ctx.imageSmoothingQuality = 'high'
        ctx.drawImage(frame, 0, 0, outW, outH)
        if (ANALYZE && index !== undefined) track[index] = measureCar(frame)
        frame.close()
        if (index === undefined) return log('fotograma sin tiempo conocido', frame.timestamp)
        queue.push({ index, canvas })
        pump()
      },
      error: (e) => log('error del decodificador:', e.message),
    })
    decoder.configure(config)

    for (const x of samples) {
      const data = buf.subarray(x.offset, x.offset + x.size)
      decoder.decode(new EncodedVideoChunk({ type: x.key ? 'key' : 'delta', timestamp: x.us, data }))
      // Sin prisa: cada fotograma en espera ocupa memoria
      while (queue.length > 6 || decoder.decodeQueueSize > 6) await new Promise((r) => setTimeout(r, 5))
    }
    await decoder.flush()
    while (queue.length || busy) await new Promise((r) => setTimeout(r, 20))

    log('LISTO:', saved, 'fotogramas de', `${outW}x${outH}`, TYPE, QUALITY)
    if (ANALYZE) {
      await fetch('/frame?name=track.json', { method: 'POST', body: JSON.stringify(track) })
      log('focus:', JSON.stringify(focusKeys(track)))
    }
    document.title = 'LISTO'
  } catch (e) {
    log('FALLÓ:', e.message)
    document.title = 'FALLÓ'
  }
</script>
